<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>技术分析</title>
<link rel="stylesheet" href="chart.css">
</head>
<body>
<div class="ta-wrap">
  <div class="ta-top"><span class="ta-app" data-i18n="app_title">技术分析</span><button type="button" class="ta-lang" id="ta-lang"></button></div>
  <form class="ta-form" id="f" novalidate>
    <label><span data-i18n="f_symbol"></span><input type="text" id="symbol" name="symbol" placeholder="AAPL" maxlength="10"
      autocomplete="off" autocapitalize="characters" spellcheck="false" required autofocus></label>
    <div class="fld"><span data-i18n="f_horizon"></span>
      <div class="ta-seg" role="group" id="horizon">
        <button type="button" data-h="swing" data-i18n="h_swing"></button><button type="button" data-h="position" data-i18n="h_position"></button>
      </div></div>
    <label class="chk"><input type="checkbox" id="refresh"><span data-i18n="c_refresh"></span></label>
    <button class="ta-go" id="go" data-i18n="go"></button>
  </form>
  <div id="msg" class="ta-msg" aria-live="polite"></div>
  <div id="out" class="ta-msg"></div>
</div>
<script src="i18n.js"></script>
<script src="chart.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const I = TA_I18N, t = I.t;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const SYMBOL_RE = /^[A-Z0-9.^-]{1,10}$/;   // same rule as ui/server.py
let horizon = "swing", result = null, pending = null;
try { if (localStorage.getItem("ta-horizon") === "position") horizon = "position"; } catch (e) { /* storage blocked */ }

function paintHorizon() {
  document.querySelectorAll("#horizon button").forEach(b => {
    b.classList.toggle("on", b.dataset.h === horizon);
    b.setAttribute("aria-pressed", String(b.dataset.h === horizon));
  });
}
document.querySelectorAll("#horizon button").forEach(b => b.addEventListener("click", () => {
  horizon = b.dataset.h;
  try { localStorage.setItem("ta-horizon", horizon); } catch (e) { /* storage blocked */ }
  paintHorizon();
}));

function proxyNotice(metrics) {
  const c = metrics?.meta?.connection || {};
  if (!String(c.route || "").startsWith("third-party")) return "";
  return `<div class="ta-warn">${esc(t("notice_proxy", c.base || ""))}${c.tls_verify === false ? " " + esc(t("notice_tls")) : ""}</div>`;
}

// Draws whatever the page currently holds: a result, the loading state, or nothing.
function show() {
  if (result) {
    $("#msg").innerHTML = proxyNotice(result.metrics);
    TAChart.render($("#out"), result.chart);
  } else if (pending) {
    $("#msg").innerHTML = `<div class="ta-card"><span class="ta-spin"></span>${esc(t("loading", pending))}</div>`;
  }
}

function fail(message) {
  $("#msg").innerHTML = `<div class="ta-card ta-error" role="alert">${esc(message)}</div>`;
}

$("#f").addEventListener("submit", async e => {
  e.preventDefault();
  const sym = $("#symbol").value.trim().toUpperCase();
  $("#symbol").value = sym;
  if (!SYMBOL_RE.test(sym)) { fail(t("err_symbol")); return; }
  const q = new URLSearchParams({ symbol: sym, horizon });
  if ($("#refresh").checked) q.set("refresh", "1");
  result = null; pending = sym;
  $("#out").innerHTML = "";
  $("#go").disabled = true;
  show();
  try {
    const res = await fetch("/api/analyze?" + q);
    const data = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
    if (!res.ok || data.error) throw new Error(data.error || res.statusText);
    result = data;
    show();
    history.replaceState(null, "", `?symbol=${encodeURIComponent(sym)}&horizon=${horizon}`);
  } catch (err) {
    fail(err.message);
  } finally {
    pending = null;
    $("#go").disabled = false;
  }
});

I.bindToggle($("#ta-lang"));
I.applyStatic(document);
I.onChange(() => { document.title = t("app_title"); show(); });
document.title = t("app_title");
const params = new URLSearchParams(location.search);
if (params.get("horizon") === "swing" || params.get("horizon") === "position") horizon = params.get("horizon");
paintHorizon();
if (params.get("symbol")) { $("#symbol").value = params.get("symbol"); $("#f").requestSubmit(); }
</script>
</body>
</html>
